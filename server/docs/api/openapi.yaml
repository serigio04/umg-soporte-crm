openapi: 3.0.3
info:
  title: Sistema de Soporte UMG - API
  description: ESPECIFICACIÓN TÉCNICA Y CONTRATO DE API RESTful para el Sistema de Gestión de Tickets e Incidentes ITIL (Universidad Mariano Gálvez).
  version: 1.0.0
servers:
  - url: http://localhost:3000/api
    description: Servidor Local de Desarrollo
  - url: https://api-soporte.miumg.edu.gt/api
    description: Servidor de Producción / Staging

paths:
  /auth/login:
    post:
      summary: Autenticación de usuarios y generación de JWT
      tags:
        - Autenticación
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        '200':
          description: Autenticación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/401Unauthorized'

  /tickets:
    post:
      summary: Crear un nuevo ticket de soporte (Transaccional)
      tags:
        - Tickets
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketInput'
      responses:
        '201':
          description: Ticket creado exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Ticket creado exitosamente
                  ticket:
                    $ref: '#/components/schemas/Ticket'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'

  /tickets/{idTicket}:
    get:
      summary: Obtener detalle completo de un ticket e historial SLA por ID
      tags:
        - Tickets
      security:
        - BearerAuth: []
      parameters:
        - name: idTicket
          in: path
          required: true
          description: Identificador numérico del ticket
          schema:
            type: integer
            example: 105
      responses:
        '200':
          description: Detalle del ticket recuperado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketDetalle'
        '404':
          $ref: '#/components/responses/404NotFound'

  /tickets/abiertos:
    get:
      summary: Consultar lista de tickets en estado Abierto
      tags:
        - Tickets
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Lista de tickets abiertos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Ticket'

  /metricas:
    get:
      summary: Indicadores generales de rendimiento y KPIs del sistema
      tags:
        - Métricas
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Métricas globales consolidadas

  /metricas/tickets/clasificacion:
    get:
      summary: Clasificación estadística de tickets por tipología ITIL y SLA
      tags:
        - Métricas
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Conteo agrupado por tipología ITIL y nivel de prioridad

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    400BadRequest:
      description: Petición inválida o error de validación de campos
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    401Unauthorized:
      description: Token JWT no proporcionado, expirado o inválido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    404NotFound:
      description: Recurso no encontrado en la base de datos
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    LoginInput:
      type: object
      required:
        - correo
        - contrasenia
      properties:
        correo:
          type: string
          format: email
          example: estudiante@miumg.edu.gt
        contrasenia:
          type: string
          format: password
          example: P@ssword123

    LoginResponse:
      type: object
      properties:
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        usuario:
          type: object
          properties:
            idUsuario:
              type: integer
              example: 5
            nombre:
              type: string
              example: Carlos Gómez
            rol:
              type: string
              enum: [Estudiante, Agente, Coordinador]
              example: Estudiante

    TicketInput:
      type: object
      required:
        - tipologiaITIL
        - descripcion
      properties:
        tipologiaITIL:
          type: string
          enum: [Incidente, Solicitud, Cambio]
          example: Incidente
        descripcion:
          type: string
          example: No tengo acceso al módulo de asignación de cursos.
        carnetEstudiante:
          type: string
          description: Requerido obligatoriamente si quien crea el ticket tiene rol Agente/Coordinador.
          example: 1290-21-4567

    Ticket:
      type: object
      properties:
        idTicket:
          type: integer
          example: 105
        tipologiaITIL:
          type: string
          example: Incidente
        descripcion:
          type: string
          example: No tengo acceso al módulo de asignación de cursos.
        prioridadSLA:
          type: string
          enum: [Alta, Media, Baja]
          example: Alta
        estado:
          type: string
          enum: [Abierto, EnProceso, Pendiente, Resuelto, Cerrado]
          example: Abierto
        idAgente:
          type: integer
          nullable: true
          example: 2

    TicketDetalle:
      allOf:
        - $ref: '#/components/schemas/Ticket'
        - type: object
          properties:
            fechaCreacion:
              type: string
              format: date-time
              example: '2026-10-01T20:00:00.000Z'
            idEstudiante:
              type: integer
              example: 10
            carneEstudiante:
              type: string
              example: 1290-21-4567
            nombreEstudiante:
              type: string
              example: Juan Pérez
            horasRestantes:
              type: number
              format: float
              example: 3.5
            vencido:
              type: boolean
              example: false
            historial:
              type: array
              items:
                type: object
                properties:
                  estado:
                    type: string
                    example: Abierto
                  fecha:
                    type: string
                    format: date-time
                    example: '2026-10-01T20:00:00.000Z'
                  comentario:
                    type: string
                    example: Ticket creado

    ErrorResponse:
      type: object
      properties:
        message:
          type: string
          example: Estudiante no encontrado